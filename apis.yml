aid: better-health
name: Better Health
description: >-
  Better Health (Better Health Supplies) is a modern, direct-to-consumer medical
  supplier that ships home medical supplies for chronic conditions straight to
  patients' doorsteps. The company covers diabetes and continuous glucose
  monitors (CGMs), incontinence, urology and self-catheterization, ostomy, and
  wound care categories, carrying leading brands and pairing product fulfillment
  with insurance-benefit navigation and one-on-one peer and clinical support.
  Better Health operates a Shopify-based storefront at joinbetter.com plus an
  education-focused community blog, and is backed by General Catalyst. It is
  cataloged in the API Evangelist network as a healthcare company profile; it
  publishes a consumer commerce experience rather than a first-party developer
  API, so this record captures its public web, security, and identity surface.
